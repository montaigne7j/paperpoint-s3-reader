<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper S3 背景圖產生器</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f4f6; --panel:#ffffff; --text:#111827; --muted:#6b7280;
  --line:#d1d5db; --accent:#111827; --soft:#f9fafb;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#111827;--panel:#1f2937;--text:#f9fafb;--muted:#9ca3af;--line:#4b5563;--accent:#f9fafb;--soft:#111827}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:20px;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:minmax(320px,430px) minmax(360px,1fr);gap:18px;padding:18px;max-width:1280px;margin:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.controls{display:grid;gap:14px}
.group{border-top:1px solid var(--line);padding-top:13px}
.group:first-child{border-top:0;padding-top:0}
.group h2{font-size:14px;margin:0 0 10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:5px;font-size:13px}
input,select,button{font:inherit}
input[type=file],select,input[type=text],input[type=number]{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--soft);color:var(--text)
}
input[type=range]{width:100%}
.check{display:flex;align-items:center;gap:8px}
small,.hint{color:var(--muted);font-size:12px}
.value{font-variant-numeric:tabular-nums;color:var(--muted)}
.buttons{display:flex;flex-wrap:wrap;gap:8px}
button{
  border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--soft);color:var(--text);cursor:pointer
}
button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.previewWrap{display:grid;place-items:center;min-height:680px;overflow:auto}
#stage{
  position:relative;display:inline-block;background:white;
  box-shadow:0 10px 32px rgba(0,0,0,.2);line-height:0
}
canvas{display:block;max-width:min(100%,540px);height:auto;image-rendering:auto}
#guide{
  position:absolute;inset:0;pointer-events:none;display:none;
  border:1px dashed rgba(255,0,0,.75)
}
#guide::before{
  content:"";position:absolute;left:7.4%;right:7.4%;top:4.2%;bottom:5.2%;
  border:1px dashed rgba(0,90,255,.75)
}
#guide::after{
  content:"狀態列參考區";position:absolute;left:0;right:0;bottom:0;height:5.2%;
  border-top:1px dashed rgba(255,0,0,.75);color:#c00;background:rgba(255,255,255,.55);
  font-size:11px;line-height:24px;text-align:center
}
.drop{
  border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);
  transition:.15s
}
.drop.drag{border-color:var(--accent);color:var(--text)}
.status{min-height:20px;color:var(--muted);font-size:12px}
@media (max-width:850px){
  main{grid-template-columns:1fr}
  .previewWrap{min-height:0}
}
</style>
</head>
<body>
<header>
  <h1>Paper S3 背景圖產生器</h1>
  <p>輸出實際像素 540×960；所有處理只在瀏覽器內完成，不會上傳圖片。</p>
</header>

<main>
<section class="panel controls">
  <div class="group">
    <h2>1. 載入圖片</h2>
    <div id="drop" class="drop">
      拖曳圖片到這裡，或選擇 JPG / PNG / WebP / BMP
      <input id="file" type="file" accept="image/*" style="margin-top:10px">
    </div>
  </div>

  <div class="group">
    <h2>2. 輸出與版面</h2>
    <div class="row">
      <label>方向
        <select id="orientation">
          <option value="portrait">直向 540×960</option>
          <option value="landscape">橫向 960×540</option>
        </select>
      </label>
      <label>縮放方式
        <select id="fit">
          <option value="cover">中央裁切填滿</option>
          <option value="contain">完整縮放置中</option>
          <option value="stretch">拉伸填滿</option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-top:10px">
      <label>背景
        <select id="background">
          <option value="white">白色</option>
          <option value="transparent">透明</option>
          <option value="black">黑色</option>
        </select>
      </label>
      <label>旋轉
        <select id="rotation">
          <option value="0">0°</option>
          <option value="90">90°</option>
          <option value="180">180°</option>
          <option value="270">270°</option>
        </select>
      </label>
    </div>
    <label style="margin-top:10px">縮放 <span id="zoomVal" class="value">100%</span>
      <input id="zoom" type="range" min="50" max="250" value="100">
    </label>
    <div class="row">
      <label>水平位置 <span id="xVal" class="value">0</span>
        <input id="posX" type="range" min="-100" max="100" value="0">
      </label>
      <label>垂直位置 <span id="yVal" class="value">0</span>
        <input id="posY" type="range" min="-100" max="100" value="0">
      </label>
    </div>
    <div class="buttons" style="margin-top:8px">
      <button data-align="center">置中</button>
      <button data-align="top">靠上</button>
      <button data-align="bottom">靠下</button>
      <button id="resetView">重設構圖</button>
    </div>
  </div>

  <div class="group">
    <h2>3. 墨水屏處理</h2>
    <label>亮度 <span id="brightnessVal" class="value">0</span>
      <input id="brightness" type="range" min="-100" max="100" value="0">
    </label>
    <label>對比 <span id="contrastVal" class="value">0</span>
      <input id="contrast" type="range" min="-100" max="100" value="0">
    </label>
    <label>淡化／白化 <span id="fadeVal" class="value">0%</span>
      <input id="fade" type="range" min="0" max="100" value="0">
    </label>
    <div class="row">
      <label>色彩模式
        <select id="colorMode">
          <option value="gray">灰階</option>
          <option value="bw">純黑白</option>
          <option value="original">保留原色</option>
        </select>
      </label>
      <label>黑白閾值 <span id="thresholdVal" class="value">160</span>
        <input id="threshold" type="range" min="0" max="255" value="160">
      </label>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="check"><input id="dither" type="checkbox"> 黑白抖動</label>
      <label class="check"><input id="invert" type="checkbox"> 黑白反轉</label>
    </div>
    <p class="hint">一般背景建議「灰階＋淡化」；睡眠圖需要最穩定顯示時，可用「純黑白＋抖動」。</p>
  </div>

  <div class="group">
    <h2>4. 輔助與匯出</h2>
    <label class="check"><input id="showGuide" type="checkbox"> 顯示安全區與狀態列參考線</label>
    <div class="row" style="margin-top:10px">
      <label>格式
        <select id="format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
        </select>
      </label>
      <label>檔名
        <input id="filename" type="text" value="paper-s3-background">
      </label>
    </div>
    <label id="qualityWrap" style="display:none;margin-top:10px">JPEG 品質 <span id="qualityVal" class="value">92%</span>
      <input id="quality" type="range" min="50" max="100" value="92">
    </label>
    <div class="buttons" style="margin-top:12px">
      <button id="download" class="primary" disabled>下載背景圖</button>
      <button id="presetBg">背景淡化預設</button>
      <button id="presetSleep">睡眠圖預設</button>
    </div>
    <div id="status" class="status"></div>
  </div>
</section>

<section class="panel previewWrap">
  <div id="stage">
    <canvas id="canvas" width="540" height="960"></canvas>
    <div id="guide"></div>
  </div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d", {willReadFrequently:true});
let source = null;

const ids = ["orientation","fit","background","rotation","zoom","posX","posY",
"brightness","contrast","fade","colorMode","threshold","dither","invert"];
ids.forEach(id => $(id).addEventListener("input", render));

function setText(id, text){ $(id).textContent = text; }
function updateLabels(){
  setText("zoomVal", $("zoom").value+"%");
  setText("xVal", $("posX").value);
  setText("yVal", $("posY").value);
  setText("brightnessVal", $("brightness").value);
  setText("contrastVal", $("contrast").value);
  setText("fadeVal", $("fade").value+"%");
  setText("thresholdVal", $("threshold").value);
  setText("qualityVal", $("quality").value+"%");
}
function dimensions(){
  return $("orientation").value === "portrait" ? [540,960] : [960,540];
}
function fillBackground(){
  const bg = $("background").value;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(bg !== "transparent"){
    ctx.fillStyle = bg === "black" ? "#000" : "#fff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
}
function render(){
  updateLabels();
  const [w,h] = dimensions();
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  fillBackground();
  if(!source) return;

  const rot = Number($("rotation").value);
  const swapped = rot===90 || rot===270;
  const iw = swapped ? source.height : source.width;
  const ih = swapped ? source.width : source.height;
  const fit = $("fit").value;
  let scaleX=w/iw, scaleY=h/ih;
  let scale = fit==="cover" ? Math.max(scaleX,scaleY) : Math.min(scaleX,scaleY);
  if(fit==="stretch"){
    scaleX *= Number($("zoom").value)/100;
    scaleY *= Number($("zoom").value)/100;
  }else{
    scale *= Number($("zoom").value)/100;
    scaleX=scaleY=scale;
  }

  const drawW=iw*scaleX, drawH=ih*scaleY;
  const maxShiftX=Math.max(w,drawW)/2, maxShiftY=Math.max(h,drawH)/2;
  const dx=w/2 + Number($("posX").value)/100*maxShiftX;
  const dy=h/2 + Number($("posY").value)/100*maxShiftY;

  ctx.save();
  ctx.translate(dx,dy);
  ctx.rotate(rot*Math.PI/180);
  const rw=source.width*scaleX, rh=source.height*scaleY;
  ctx.drawImage(source,-rw/2,-rh/2,rw,rh);
  ctx.restore();

  applyPixels();
}
function applyPixels(){
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=img.data;
  const brightness=Number($("brightness").value)*2.55;
  const c=Number($("contrast").value);
  const factor=(259*(c+255))/(255*(259-c));
  const fade=Number($("fade").value)/100;
  const mode=$("colorMode").value;
  const threshold=Number($("threshold").value);
  const invert=$("invert").checked;

  for(let i=0;i<d.length;i+=4){
    let r=factor*(d[i]-128)+128+brightness;
    let g=factor*(d[i+1]-128)+128+brightness;
    let b=factor*(d[i+2]-128)+128+brightness;
    r=r*(1-fade)+255*fade;
    g=g*(1-fade)+255*fade;
    b=b*(1-fade)+255*fade;
    if(mode!=="original"){
      let y=.299*r+.587*g+.114*b;
      if(invert) y=255-y;
      r=g=b=y;
    }else if(invert){
      r=255-r;g=255-g;b=255-b;
    }
    d[i]=Math.max(0,Math.min(255,r));
    d[i+1]=Math.max(0,Math.min(255,g));
    d[i+2]=Math.max(0,Math.min(255,b));
  }

  if(mode==="bw"){
    if($("dither").checked) floydSteinberg(d,canvas.width,canvas.height,threshold);
    else{
      for(let i=0;i<d.length;i+=4){
        const v=d[i] < threshold ? 0 : 255;
        d[i]=d[i+1]=d[i+2]=v;
      }
    }
  }
  ctx.putImageData(img,0,0);
}
function floydSteinberg(data,w,h,threshold){
  const gray = new Float32Array(w*h);
  for(let p=0,i=0;p<gray.length;p++,i+=4) gray[p]=data[i];
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const p=y*w+x, old=gray[p], val=old<threshold?0:255, err=old-val;
      gray[p]=val;
      if(x+1<w) gray[p+1]+=err*7/16;
      if(y+1<h){
        if(x>0) gray[p+w-1]+=err*3/16;
        gray[p+w]+=err*5/16;
        if(x+1<w) gray[p+w+1]+=err*1/16;
      }
    }
  }
  for(let p=0,i=0;p<gray.length;p++,i+=4){
    const v=gray[p]<128?0:255;
    data[i]=data[i+1]=data[i+2]=v;
  }
}
function loadFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      source=img; $("download").disabled=false;
      $("status").textContent=`已載入 ${file.name}（${img.width}×${img.height}）`;
      render();
    };
    img.onerror=()=> $("status").textContent="無法讀取此圖片。";
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
$("file").addEventListener("change",e=>loadFile(e.target.files[0]));
const drop=$("drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag")}));
drop.addEventListener("drop",e=>loadFile(e.dataTransfer.files[0]));

document.querySelectorAll("[data-align]").forEach(btn=>btn.addEventListener("click",()=>{
  $("posX").value=0;
  $("posY").value=btn.dataset.align==="top"?-50:btn.dataset.align==="bottom"?50:0;
  render();
}));
$("resetView").addEventListener("click",()=>{
  $("rotation").value=0;$("zoom").value=100;$("posX").value=0;$("posY").value=0;render();
});
$("showGuide").addEventListener("change",()=> $("guide").style.display=$("showGuide").checked?"block":"none");
$("format").addEventListener("change",()=>{
  $("qualityWrap").style.display=$("format").value==="jpeg"?"grid":"none";
});
$("quality").addEventListener("input",updateLabels);

$("presetBg").addEventListener("click",()=>{
  $("fit").value="cover";$("background").value="white";$("colorMode").value="gray";
  $("brightness").value=8;$("contrast").value=-10;$("fade").value=45;
  $("dither").checked=false;$("invert").checked=false;render();
});
$("presetSleep").addEventListener("click",()=>{
  $("fit").value="cover";$("background").value="white";$("colorMode").value="bw";
  $("brightness").value=0;$("contrast").value=10;$("fade").value=0;
  $("threshold").value=160;$("dither").checked=true;$("invert").checked=false;render();
});
$("download").addEventListener("click",()=>{
  render();
  const format=$("format").value;
  if(format==="jpeg" && $("background").value==="transparent"){
    $("status").textContent="JPEG 不支援透明背景，請改用 PNG 或白色背景。";
    return;
  }
  const mime=format==="png"?"image/png":"image/jpeg";
  const quality=Number($("quality").value)/100;
  const a=document.createElement("a");
  const [w,h]=dimensions();
  const base=($("filename").value.trim()||"paper-s3-background").replace(/[\\/:*?"<>|]+/g,"-");
  a.download=`${base}-${w}x${h}.${format==="jpeg"?"jpg":"png"}`;
  a.href=canvas.toDataURL(mime,quality);
  a.click();
  $("status").textContent=`已輸出 ${w}×${h} ${format.toUpperCase()}。`;
});

updateLabels();
fillBackground();
</script>
</body>
</html>
